<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="DejaVu Sans, Arial, sans-serif">
  <style>
    .t  { font-size: 15px; fill: #1b1b1b; }
    .tb { font-size: 15px; font-weight: bold; fill: #1b1b1b; }
    .s  { font-size: 12px; fill: #333; }
    .h  { font-size: 19px; font-weight: bold; fill: #111; }
    .note { font-size: 12.5px; fill: #8a1c1c; font-style: italic; }
  </style>
  <rect width="1240" height="800" fill="#ffffff"/>

  <text x="620" y="32" text-anchor="middle" class="h">Atividade 3 — Camadas de infraestrutura dos ambientes usados</text>

  <!-- ================= ESQUERDA: Linux nativo (Partes A e B) ================= -->
  <text x="300" y="68" text-anchor="middle" class="tb">Ambiente 1 — Partes A e B (Linux nativo, sem VM)</text>

  <!-- containers -->
  <rect x="30" y="85" width="540" height="190" rx="8" fill="#eef6ff" stroke="#3b78c4" stroke-dasharray="6 4"/>
  <text x="300" y="105" text-anchor="middle" class="s">Contêineres = processos do host, isolados por namespaces e limitados por cgroups</text>
  <rect x="50" y="118" width="240" height="145" rx="8" fill="#d6e8ff" stroke="#3b78c4"/>
  <text x="170" y="140" text-anchor="middle" class="tb">Contêiner A (so3_ns_a)</text>
  <text x="62" y="162" class="s">python:3.12-slim @sha256:5e2bdb1b…</text>
  <text x="62" y="182" class="s">PID 1 interno = sleep 600</text>
  <text x="62" y="200" class="s">PID no host = 43568</text>
  <text x="62" y="220" class="s">pid:[4026532577]  mnt:[4026532554]</text>
  <text x="62" y="238" class="s">net:[4026532579]  (--network none)</text>
  <rect x="310" y="118" width="240" height="145" rx="8" fill="#d6e8ff" stroke="#3b78c4"/>
  <text x="430" y="140" text-anchor="middle" class="tb">Contêiner B (so3_ns_b)</text>
  <text x="322" y="162" class="s">python:3.12-slim @sha256:5e2bdb1b…</text>
  <text x="322" y="182" class="s">PID 1 interno = sleep 600</text>
  <text x="322" y="200" class="s">PID no host = 43625</text>
  <text x="322" y="220" class="s">pid:[4026533042]  mnt:[4026533039]</text>
  <text x="322" y="238" class="s">net:[4026533044]  (--network none)</text>

  <!-- runtime -->
  <rect x="30" y="290" width="540" height="70" rx="8" fill="#e8f5e9" stroke="#3a8a43"/>
  <text x="300" y="315" text-anchor="middle" class="tb">Docker Engine 29.9.3 (rootful) + Compose v5.7.0</text>
  <text x="300" y="338" text-anchor="middle" class="s">dockerd → containerd v2.4.2 → runc 1.5.2 (cria namespaces e cgroups via syscalls)</text>

  <!-- userland + kernel -->
  <rect x="30" y="375" width="540" height="200" rx="8" fill="#fff4e0" stroke="#c98a12" stroke-width="2"/>
  <text x="300" y="400" text-anchor="middle" class="tb">Ubuntu 26.04.1 LTS (host do daemon = host do terminal)</text>
  <rect x="50" y="415" width="500" height="145" rx="6" fill="#ffe2a8" stroke="#c98a12"/>
  <text x="300" y="440" text-anchor="middle" class="tb">Kernel 7.0.0-43-generic — ÚNICO kernel, compartilhado</text>
  <text x="300" y="463" text-anchor="middle" class="s">namespaces: pid · mnt · net · uts · ipc · cgroup (visão)</text>
  <text x="300" y="485" text-anchor="middle" class="s">cgroup v2 unificado (driver systemd): cpu · memory · pids · io · cpuset (consumo)</text>
  <text x="300" y="507" text-anchor="middle" class="s">LSM / políticas: AppArmor (docker-default) + seccomp (builtin) + capabilities</text>
  <text x="300" y="535" text-anchor="middle" class="note">uname -r dentro do contêiner = 7.0.0-43-generic (mesmo kernel)</text>

  <!-- hardware -->
  <rect x="30" y="590" width="540" height="80" rx="8" fill="#ececec" stroke="#666"/>
  <text x="300" y="615" text-anchor="middle" class="tb">Hardware físico (notebook)</text>
  <text x="300" y="638" text-anchor="middle" class="s">Intel Core i5-11300H — 4 núcleos / 8 CPUs lógicas · 16 GB RAM (15 GiB visíveis)</text>
  <text x="300" y="658" text-anchor="middle" class="s">systemd-detect-virt = none → sem hypervisor entre hardware e kernel</text>

  <!-- ================= DIREITA: WSL2 (Partes C e D) ================= -->
  <text x="930" y="68" text-anchor="middle" class="tb">Ambiente 2 — Partes C e D (WSL2, VM leve)</text>

  <rect x="660" y="85" width="540" height="190" rx="8" fill="#eef6ff" stroke="#3b78c4" stroke-dasharray="6 4"/>
  <text x="930" y="105" text-anchor="middle" class="s">Um contêiner por execução, criado e removido pelo script</text>
  <rect x="680" y="118" width="240" height="145" rx="8" fill="#d6e8ff" stroke="#3b78c4"/>
  <text x="800" y="140" text-anchor="middle" class="tb">C1 × 3 execuções</text>
  <text x="692" y="162" class="s">--cpus 0.5 → cpu.max 50000/100000</text>
  <text x="692" y="182" class="s">memory/swap: 256m / 256m</text>
  <text x="692" y="200" class="s">--pids-limit 64</text>
  <text x="692" y="222" class="s">mesma imagem @sha256:5e2bdb1b…</text>
  <rect x="940" y="118" width="240" height="145" rx="8" fill="#d6e8ff" stroke="#3b78c4"/>
  <text x="1060" y="140" text-anchor="middle" class="tb">C2 × 3 + teste read-only</text>
  <text x="952" y="162" class="s">--cpus 1.0 → cpu.max 100000/100000</text>
  <text x="952" y="182" class="s">mesmos limites de RAM e PIDs</text>
  <text x="952" y="200" class="s">Parte D: -v dados_demo:/dados:ro</text>
  <text x="952" y="222" class="s">--user 65534 --cap-drop ALL</text>

  <rect x="660" y="290" width="540" height="70" rx="8" fill="#e8f5e9" stroke="#3a8a43"/>
  <text x="930" y="315" text-anchor="middle" class="tb">Docker Engine 29.1.3 (rootful, nativo na distro)</text>
  <text x="930" y="338" text-anchor="middle" class="s">não é Docker Desktop — daemon roda dentro da própria VM WSL2</text>

  <rect x="660" y="375" width="540" height="200" rx="8" fill="#fff4e0" stroke="#c98a12" stroke-width="2"/>
  <text x="930" y="400" text-anchor="middle" class="tb">VM WSL2 — Ubuntu 24.04.5 LTS (12 CPUs / 13 GiB visíveis)</text>
  <rect x="680" y="415" width="500" height="145" rx="6" fill="#ffe2a8" stroke="#c98a12"/>
  <text x="930" y="440" text-anchor="middle" class="tb">Kernel 6.18.54.1-microsoft-standard-WSL2</text>
  <text x="930" y="463" text-anchor="middle" class="s">compartilhado pelos contêineres C1/C2/D</text>
  <text x="930" y="485" text-anchor="middle" class="s">cgroup v2 (driver systemd): cpuset cpu io memory hugetlb pids rdma</text>
  <text x="930" y="507" text-anchor="middle" class="s">seccomp builtin; AppArmor/SELinux ausentes no kernel WSL2</text>

  <rect x="660" y="590" width="540" height="80" rx="8" fill="#ececec" stroke="#666"/>
  <text x="930" y="615" text-anchor="middle" class="tb">Hardware físico + Windows + Hyper-V (hypervisor)</text>
  <text x="930" y="638" text-anchor="middle" class="s">o Windows e a VM WSL2 rodam sobre o hypervisor;</text>
  <text x="930" y="658" text-anchor="middle" class="s">o kernel Linux dos contêineres é o da VM, não o do Windows</text>

  <!-- legenda -->
  <text x="620" y="705" text-anchor="middle" class="t">Contêiner ≠ VM: os contêineres não têm kernel próprio. Fazem syscalls ao kernel da camada laranja do seu ambiente.</text>
  <text x="620" y="728" text-anchor="middle" class="t">Namespaces mudam o que o processo VÊ; cgroups limitam o que ele CONSOME; usuário/capabilities/LSM definem o que ele PODE.</text>
  <text x="620" y="760" text-anchor="middle" class="note">Dados da esquerda: evidencias/ambiente.txt e namespaces.txt (09–10/11/2026). Dados da direita: README das Partes C/D (Integrante 2).</text>
</svg>
